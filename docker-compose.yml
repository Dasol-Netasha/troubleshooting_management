services:
  db:
    image: postgres:16
    container_name: base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trouble-shooting-manage-alpha-db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-user}
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    # ports: 삭제 — 외부는 물론 호스트에도 노출하지 않음 (backend가 내부망 db:5432 로 접근)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-trouble-shooting-manage-alpha-db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: base-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-user}@db:5432/${POSTGRES_DB:-trouble-shooting-manage-alpha-db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-issue-images}
      MINIO_SECURE: "false"
      # 브라우저가 직접 접근할 이미지 URL — 이제 nginx가 뚫어주는 /files 경로를 통해 도메인으로 나감
      MINIO_PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:-yourdomain.com}/files
      TZ: ${TZ:-Asia/Seoul}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    # ports: 삭제 — nginx가 /api 로 내부망(backend:8000)에 프록시

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: base-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-Asia/Seoul}
    command: server /data --console-address ":9001"
    # ports: 삭제 — 9000(API)은 nginx의 /files 경로로만 내부 접근, 9001(콘솔)은 완전히 비공개
    #   관리 콘솔이 필요하면 로컬에서 `ssh -p 443 -L 9001:localhost:9001 user@도메인` 으로 터널링해서 쓰세요.
    volumes:
      - minio_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: base-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # ports: 삭제 — nginx가 / 로 내부망(frontend:80)에 프록시

  nginx:
    image: nginx:alpine
    container_name: base-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro   # Let's Encrypt 인증서 (fullchain.pem, privkey.pem)
    ports:
      - "127.0.0.1:8443:443"   # 나스 로컬에서만 리슨. 실제 외부 노출은 sslh(443)가 담당
    depends_on:
      - frontend
      - backend
      - minio

volumes:
  postgres_data:
  minio_data:

# 참고: 별도 networks: 블록을 안 만들어도 compose가 기본 브리지 네트워크를 만들어서
# 서비스명(db, backend, minio, frontend)으로 서로 통신 가능합니다. 지금 파일도 그 방식 그대로입니다.